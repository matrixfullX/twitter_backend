services:
  - type: keyvalue
    name: twitter-cache
    region: virginia
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: twitter-api
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./docker/prod/django/Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: TYPE_DATABASE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: twitter-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: twitter-cache
          type: keyvalue
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DOMAIN_FRONTEND
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
databases:
  - name: twitter-db
    region: virginia
    plan: free
    postgresMajorVersion: "16"
    databaseName: twitter
    user: twitter_app
    ipAllowList: []
